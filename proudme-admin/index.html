<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ProudMe Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#3C3293">

  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    connect-src 'self' https://proudme-backend.onrender.com;
    script-src 'self';
    script-src-attr 'none';
    style-src 'self' https://fonts.googleapis.com 'unsafe-inline';
    font-src https://fonts.gstatic.com;
    img-src 'self' data:;
    object-src 'none';
    frame-ancestors 'none';
    base-uri 'none';
    form-action 'self';
  ">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
  <!-- RELEASE CONVENTION (R50+): bump the ?v= tag on styles.css / app.js /
       panels.js in BOTH index.html and dashboard.html on EVERY release.
       GitHub Pages caches for 600s and Render serves /admin static with
       maxAge 1h; the version tag prevents mixed-version HTML/JS skew. -->
  <link rel="stylesheet" href="styles.css?v=r54">
  <link rel="icon" href="../assets/appicon-indigo.svg" type="image/svg+xml">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="auth-title">
      <header class="auth-card__head">
        <img class="auth-card__mark" src="../assets/logo-mark-brand.svg" alt="" width="40" height="40">
        <h1 id="auth-title">ProudMe Admin</h1>
        <p class="auth-card__sub">Internal research console. Access is allowlisted; this page is unindexed.</p>
      </header>

      <form id="login-form" class="auth-form" novalidate>
        <label class="field">
          <span class="field__label">Username</span>
          <input
            id="username"
            name="username"
            type="text"
            autocomplete="username"
            required
            autocapitalize="off"
            spellcheck="false"
          >
        </label>
        <label class="field">
          <span class="field__label">Password</span>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          >
        </label>
        <button id="submit-btn" type="submit" class="btn btn--primary">Sign in</button>
        <p id="auth-error" class="auth-error" role="alert" aria-live="polite"></p>
      </form>

      <footer class="auth-card__foot">
        <p>If you reached this page by accident, close the tab. Nothing on it is public-facing.</p>
      </footer>
    </section>
  </main>

  <script src="app.js?v=r54"></script>
</body>
</html>
